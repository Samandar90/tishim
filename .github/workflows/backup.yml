name: Резервная копия базы

# Бесплатный тариф Supabase копий не делает. Раз в сутки pg_dump схем public, auth и
# storage уходит артефактом на 30 дней. Нужен секрет SUPABASE_DB_URL — строка
# подключения через session pooler (Project Settings → Database → Connection string,
# режим Session, с паролем). Без секрета прогон завершается сразу, без ошибки.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

jobs:
  dump:
    name: pg_dump → артефакт
    runs-on: ubuntu-latest
    steps:
      - name: Есть ли секрет
        id: secret
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "SUPABASE_DB_URL не задан — копия пропущена"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Клиент PostgreSQL 17
        if: steps.secret.outputs.present == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - name: Дамп
        if: steps.secret.outputs.present == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          stamp=$(date -u +%Y%m%d-%H%M)
          pg_dump "$DB_URL" --no-owner --no-privileges --format=custom \
            --schema=public --schema=auth --schema=storage \
            --file="tishim-$stamp.dump"
          ls -la tishim-*.dump

      - name: Сохранить артефакт
        if: steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tishim-db-${{ github.run_id }}
          path: tishim-*.dump
          retention-days: 30
