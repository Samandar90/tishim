name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Свежий push отменяет прогон предыдущего коммита той же ветки — кроме main.
# На main отменять нельзя: там включён автодеплой Render, и отменённый прогон
# означал бы коммит, уехавший в прод вообще без результата проверок.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Типы, линт, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Версия закреплена в .nvmrc, а не диапазоном из engines.
          # engines говорит про минимум (Supabase требует >=22), .nvmrc — про
          # конкретную версию. Это важнее, чем кажется: node 22 несёт npm 10,
          # node 24 — npm 11, и они по-разному записывают платформенные пакеты
          # в package-lock. Один lock под две версии npm не ложится, поэтому
          # CI, Render и локальная разработка обязаны быть на одной.
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      # Часовой пояс задан и здесь, и в vitest.setup.ts. Дублирование намеренное:
      # под UTC ошибки со смешением локального и мирового времени не
      # воспроизводятся, а раннер GitHub всегда UTC.
      - name: Тесты
        run: npm test
        env:
          TZ: Asia/Tashkent
